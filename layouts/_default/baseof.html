<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  {{ partial "head-meta.html" . }}
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/hl-dark.css">
  {{ with resources.Get "sass/main.scss" | css.Sass | minify | fingerprint }}
  <link rel="stylesheet" href="{{ .RelPermalink }}">
  {{ end }}
  {{ partial "head-assets.html" . }}
</head>

<body class="{{ block "bodyclass" . }}{{ end }}">
  <script>
    // 首帧主题初始化(防闪白):有存储则尊重用户选择,无存储则跟随系统偏好
    const theme = localStorage.getItem('theme');
    const isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (isDark) {
      document.body.classList.add('dark');
      document.documentElement.classList.add('dark');
    }
  </script>
  {{ block "main" . }}{{ end }}
  {{ block "scripts" . }}{{ end }}
  <script src="/js/theme.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/oneko.js" defer></script>
</body>

</html>
